<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Space Shooter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 100;
    }
    #instructions {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 16px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 100;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="loading">Loading 3D models...</div>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Health: <span id="health">100</span></div>
  </div>
  <div id="instructions" >
    Arrow Keys: Move | Space: Shoot | Mouse: Look Around
  </div>
  <canvas id="gameCanvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    // Game state
    const gameState = {
      score: 0,
      health: 100,
      playerSpeed: 0.5,
      bulletSpeed: 2,
      enemySpeed: 0.3,
      bullets: [],
      enemies: [],
      keys: {},
      mouseX: 0,
      mouseY: 0
    };

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000011);
    scene.fog = new THREE.Fog(0x000011, 50, 200);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 15);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(10, 20, 10);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    const pointLight = new THREE.PointLight(0x4444ff, 1, 100);
    pointLight.position.set(0, 10, 0);
    scene.add(pointLight);

    // Starfield
    const starGeometry = new THREE.BufferGeometry();
    const starVertices = [];
    for (let i = 0; i < 1000; i++) {
      starVertices.push(
        (Math.random() - 0.5) * 200,
        (Math.random() - 0.5) * 200,
        (Math.random() - 0.5) * 200
      );
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Player object
    let player = null;
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // FBX Loader
    const fbxLoader = new FBXLoader();
    let playerModelLoaded = false;
    let enemyModelTemplate = null;
    let modelsLoaded = 0;
    const totalModels = 2;

    // Load player model
    fbxLoader.load('assets/player/Destroyer_01.fbx', (fbx) => {
      fbx.scale.set(0.01, 0.01, 0.01);
      fbx.rotation.y = Math.PI;
      playerGroup.add(fbx);
      player = fbx;
      playerModelLoaded = true;
      modelsLoaded++;
      checkModelsLoaded();
    }, undefined, (error) => {
      console.error('Error loading player model:', error);
      createFallbackPlayer();
      modelsLoaded++;
      checkModelsLoaded();
    });

    // Load enemy model template
    fbxLoader.load('assets/enemy/Corvette_03.fbx', (fbx) => {
      fbx.scale.set(0.01, 0.01, 0.01);
      enemyModelTemplate = fbx;
      modelsLoaded++;
      checkModelsLoaded();
    }, undefined, (error) => {
      console.error('Error loading enemy model:', error);
      createFallbackEnemyTemplate();
      modelsLoaded++;
      checkModelsLoaded();
    });

    function checkModelsLoaded() {
      if (modelsLoaded >= totalModels) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('instructions').style.display = 'block';
      }
    }

    function createFallbackPlayer() {
      const geometry = new THREE.ConeGeometry(0.5, 2, 8);
      const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
      player = new THREE.Mesh(geometry, material);
      player.rotation.x = Math.PI / 2;
      playerGroup.add(player);
      playerModelLoaded = true;
    }

    function createFallbackEnemyTemplate() {
      const geometry = new THREE.ConeGeometry(0.4, 1.5, 8);
      const material = new THREE.MeshPhongMaterial({ color: 0xff0000 });
      enemyModelTemplate = new THREE.Mesh(geometry, material);
      enemyModelTemplate.rotation.x = -Math.PI / 2;
    }

    // Input handling
    window.addEventListener('keydown', (e) => {
      gameState.keys[e.key] = true;
      if (e.key === ' ') {
        e.preventDefault();
        shootBullet();
      }
    });

    window.addEventListener('keyup', (e) => {
      gameState.keys[e.key] = false;
    });

    window.addEventListener('mousemove', (e) => {
      gameState.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      gameState.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Bullet creation
    function shootBullet() {
      const bulletGeometry = new THREE.SphereGeometry(0.2, 8, 8);
      const bulletMaterial = new THREE.MeshPhongMaterial({ 
        color: 0xffff00,
        emissive: 0xffff00,
        emissiveIntensity: 0.5
      });
      const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
      bullet.position.copy(playerGroup.position);
      bullet.position.z -= 2;
      scene.add(bullet);
      gameState.bullets.push(bullet);
    }

    // Enemy spawning
    function spawnEnemy() {
      if (!enemyModelTemplate || gameState.enemies.length >= 5) return;

      const enemy = enemyModelTemplate.clone();
      enemy.position.set(
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 10,
        -50
      );
      enemy.userData.health = 1;
      scene.add(enemy);
      gameState.enemies.push(enemy);
    }

    // Collision detection
    function checkCollisions() {
      // Bullets vs Enemies
      for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        const bullet = gameState.bullets[i];
        for (let j = gameState.enemies.length - 1; j >= 0; j--) {
          const enemy = gameState.enemies[j];
          const distance = bullet.position.distanceTo(enemy.position);
          if (distance < 2) {
            scene.remove(bullet);
            gameState.bullets.splice(i, 1);
            scene.remove(enemy);
            gameState.enemies.splice(j, 1);
            gameState.score += 10;
            document.getElementById('score').textContent = gameState.score;
            break;
          }
        }
      }

      // Enemies vs Player
      for (let i = gameState.enemies.length - 1; i >= 0; i--) {
        const enemy = gameState.enemies[i];
        const distance = playerGroup.position.distanceTo(enemy.position);
        if (distance < 2) {
          scene.remove(enemy);
          gameState.enemies.splice(i, 1);
          gameState.health -= 10;
          document.getElementById('health').textContent = gameState.health;
          if (gameState.health <= 0) {
            alert('Game Over! Score: ' + gameState.score);
            location.reload();
          }
        }
      }
    }

    // Game loop
    let lastEnemySpawn = 0;
    function animate(time) {
      requestAnimationFrame(animate);

      // Player movement
      if (gameState.keys['ArrowLeft'] || gameState.keys['a']) {
        playerGroup.position.x -= gameState.playerSpeed;
      }
      if (gameState.keys['ArrowRight'] || gameState.keys['d']) {
        playerGroup.position.x += gameState.playerSpeed;
      }
      if (gameState.keys['ArrowUp'] || gameState.keys['w']) {
        playerGroup.position.y += gameState.playerSpeed;
      }
      if (gameState.keys['ArrowDown'] || gameState.keys['s']) {
        playerGroup.position.y -= gameState.playerSpeed;
      }

      // Constrain player position
      playerGroup.position.x = Math.max(-10, Math.min(10, playerGroup.position.x));
      playerGroup.position.y = Math.max(-5, Math.min(5, playerGroup.position.y));

      // Mouse look
      playerGroup.rotation.y = gameState.mouseX * 0.3;
      playerGroup.rotation.x = gameState.mouseY * 0.2;

      // Update bullets
      for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        const bullet = gameState.bullets[i];
        bullet.position.z -= gameState.bulletSpeed;
        if (bullet.position.z < -100) {
          scene.remove(bullet);
          gameState.bullets.splice(i, 1);
        }
      }

      // Update enemies
      for (let i = gameState.enemies.length - 1; i >= 0; i--) {
        const enemy = gameState.enemies[i];
        enemy.position.z += gameState.enemySpeed;
        enemy.rotation.y += 0.02;
        if (enemy.position.z > 20) {
          scene.remove(enemy);
          gameState.enemies.splice(i, 1);
        }
      }

      // Spawn enemies
      if (time - lastEnemySpawn > 2000) {
        spawnEnemy();
        lastEnemySpawn = time;
      }

      // Check collisions
      checkCollisions();

      // Rotate stars
      stars.rotation.y += 0.0002;

      renderer.render(scene, camera);
    }

    animate(0);
  </script>
</body>
</html>
